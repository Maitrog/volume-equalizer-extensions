name: Validate locales

on:
  pull_request:
    paths:
      - "_locales/**"
      - "tools/validateLocalizationLengths.js"
      - "package.json"
      - "package-lock.json"
      - "popup.html"
      - "resources/styles/popup.css"
      - ".github/workflows/validate-locales.yml"

  push:
    branches:
      - main
    paths:
      - "_locales/**"
      - "tools/validateLocalizationLengths.js"
      - "package.json"
      - "package-lock.json"
      - "popup.html"
      - "resources/styles/popup.css"
      - ".github/workflows/validate-locales.yml"

jobs:
  validate-locales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate localization layout
        run: npm run lint:locales
